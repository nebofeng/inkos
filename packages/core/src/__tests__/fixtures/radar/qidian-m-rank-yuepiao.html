,"_index":4},{"catId":21,"rankCnt":"2.19万月票","bName":"让仙门再次伟大","rankNum":6,"cat":"玄幻","cnt":"162.25万字","subCatId":8,"bid":"1049107474","subCat":"东方玄幻","bAuth":"鹤守月满池","desc":"成为修士的第一天。王平：“师兄弟没一个当人的，和这群畜生在一起，怎么能搞得好修仙呢？”成为炼炁士的第一天。王平：“其实仙门也不是完全没有可取之处，至少逆伐下修的传统还是很不错的。”成为修真者的第一天。王平：“我要守护好仙门，让它继续欣欣向荣下去。”成为仙人的多年后。王平：“欺天啦！这帮该死的刁民，天底下还有仙人比我对下修更宽容的吗？居然还敢造我的反，真是有点修为就不知道仙道的辛酸了，看来必须出重拳！”","_index":5},{"catId":5,"rankCnt":"1.91万月票","bName":"廓晋","rankNum":7,"cat":"历史","cnt":"143.86万字","subCatId":222,"bid":"1047881102","subCat":"两晋隋唐","bAuth":"榴弹怕水","desc":"廓者，一曰扩，二曰清。既至东晋十六国，当中流击水，矢志北伐，先驱中原五胡，再扫朝堂士族门阀。所谓廓清天下，开创新业，延续华夏。道理上是如此，但永和五年，公元349年的秋日，当穿越者来到东晋，成为东晋朝最常见的流民之一后，首先要考虑的是，今年冬天怎么熬过去？如何避免跌落斩杀线？又是一本老套的穿越故事。","_index":6},{"catId":22,"rankCnt":"1.84万月票","bName":"原来我是仙道天骄","rankNum":8,"cat":"仙侠","cnt":"74.97万字","subCatId":44,"bid":"1050032171","subCat":"幻想修仙","bAuth":"醋六香","desc":"仙历14994年，七月。陈拙考入太清市炼丹职业技术学院，获批人造灵根，成为一名拥有单一木属性的人造灵根修仙者。原本，陈拙已经看到了自己的未来，老老实实修行个百余年，在流水线上为公司打工，看看有没有机会修炼到炼气巅峰拿点退休金什么的。但就在植入灵根后不久，陈拙忽然发现自己随身自带破界珠，可以带着自己肉身穿越到另一个古老的修仙世界。于是，陈拙发现自己的未来好像发生了变化。“什么叫宗门终于等到了天灵根的仙道天骄？”陈拙一阵恍惚。原来我是仙道天骄？自此，陈拙踏上了冒充天骄的修仙之路。","_index":7},{"catId":4,"rankCnt":"1.82万月票","bName":"1984：从川菜馆开始","rankNum":9,"cat":"都市","cnt":"469.29万字","subCatId":12,"bid":"1044818845","subCat":"都市生活","bAuth":"轻语江湖","desc":"又名《川味人间》【年代文、美食、日常、种田】美食博主周砚，重生1984。开局接盘一家破产川菜馆。在这个物资匮乏的年代，给食客们一点高标准的美味震撼！跷脚牛肉、夫妻肺片、麻婆豆腐、东坡肘子、跳水兔……炒、煸、烧、蒸、炸、煮、卤、熏……川菜百味，一菜一格！从此，川南小镇多了一家远近闻名的小饭店。食客们围着小桌吃跷脚牛肉，年轻人最爱一毛一串钵钵鸡，老饕们对着一盆临江鳝丝流下了口水……这一世，钱要好好挣，生活慢慢过。没有装逼打脸，只有美食、悠闲日常。【一本纯粹的美食文，温馨日常+川渝暴龙！】【万订美食文！值得一试！】本书又名：《国宴，你就煮颗白菜？》《吃个坝坝宴，你上满汉全席？》《川渝暴龙也是传承？》","_index":8},{"catId":12,"rankCnt":"1.69万月票","bName":"神宠供应商","rankNum":10,"cat":"轻小说","cnt":"25.82万字","subCatId":60,"bid":"1050460263","subCat":"原生幻想","bAuth":"轻泉流响","desc":"海洋纪元，人类与变异海兽共存。体长百米的大王乌贼拉动战船，穿过危险的海峡；身如岛屿的巨型鲸鱼上，有人建立国家；海盗、商船、大秘宝、传说中的航路……时值大航海时代，洛羽穿越而来，成为了一名见习御兽师。多年之后……“什么叫我的宠兽不合法？”“我这就是正经御兽！”拥有「史上最强生物学家」「进化狂潮发起人」「究极繁育大师」「大地之神缔造者」「神宠供应商」等众多头衔的洛羽反驳道。","_index":9},{"catId":21,"rankCnt":"1.65万月票","bName":"剑烛大荒","rankNum":11,"cat":"玄幻","cnt":"75.21万字","subCatId":8,"bid":"1048862481","subCat":"东方玄幻","bAuth":"爱潜水的乌贼","desc":"“烛龙，食之开浑沌、照九阴、掌昼夜、更替四时、呼风唤雨。“相柳，食之蚀大地、吞山岳、毒百世、九头各行。“肥遗，食之克虫豸、御精神、百病不入。“蜮虫，食之擅伏擅藏、含沙射人。“……“这个世界的秘传《山海经》怎么和我上辈子看得不太一样？”丁松言默念之中，侧头望向旁边的人：“你是说，这些东西早已绝迹，只有先吃者根据身体变化开创的武功遗留下来，可以修炼？”","_index":10},{"catId":21,"rankCnt":"1.54万月票","bName":"青山","rankNum":12,"cat":"玄幻","cnt":"270.25万字","subCatId":8,"bid":"1033014772","subCat":"东方玄幻","bAuth":"会说话的肘子","desc":"当今名利已斩天下九分侠气，诸位，这是天下最后一分侠气的故事。","_index":11},{"catId":4,"rankCnt":"1.45万月票","bName":"国民律师","rankNum":13,"cat":"都市","cnt":"160.78万字","subCatId":12,"bid":"1047321972","subCat":"都市生活","bAuth":"青衫仗剑行天涯","desc":"2002年，10月1日。徐德穿越至东国绿森市，成为一名律师，并且获得只要能让客户满意，便能抽取奖励的金手指。但刚穿越便碰上硬茬客户！客户被绿，妻子数次出轨欲要离婚分割财产，企图和小三远走高飞！面对上述，寻常人选择：【选项a：财产分割，让委托人戴上绿帽，看着对方与小三挥霍自己钱财。】【选项b：转移财产进行离婚，分割少部分钱财忍气吞声。】为让客户满意。徐德决定提供一点罕见的服务。“比如......”“让你可以合法合规的进行报复！”客户震惊：“报复还能合法！？”徐德：“当然可以。”“哪怕你翻烂了《刑法典》，也找不出任何一丝违法性！”......多年后，律界众同行看着在法律边缘反复横跳，好似挑衅的法内狂徒徐德，忍不住发出灵魂深处的咆哮。“究竟是谁让他做律师的！？”","_index":12},{"catId":9,"rankCnt":"1.17万月票","bName":"异度旅社","rankNum":14,"cat":"科幻","cnt":"289.04万字","subCatId":251,"bid":"1041604040","subCat":"时空穿梭","bAuth":"远瞳","desc":"在日常之下，在理性尽头，在你所熟悉的世界之外——是你从未想象过的风景。当于生第一次打开那扇门的时候，他所熟悉的世界便轰然倒塌。而那直抵世界根源的“真相”，扑面而来。","_index":13},{"catId":21,"rankCnt":"1.11万月票","bName":"我在永夜打造庇护所","rankNum":15,"cat":"玄幻","cnt":"270.23万字","subCatId":73,"bid":"1046692521","subCat":"异世大陆","bAuth":"中世纪的兔子","desc":"漫剧「三千庇护」原著。...陈凡穿越至一个诡异玄幻世界中，在这个世界，黑夜降临后，无数诡物肆虐人间。他通过穿越自带的永夜领主面板成为一名建筑师，一点一点在荒原上打造属于自己的营地。诡火、城墙、祭塔，一座座建筑凭空升起，他的名声也渐渐响彻整个江北。直至——当「终极天灾」降临，无数疯狂的诡物危害人间，民不聊生之时。一座横贯大陆的万里长城，凭空升起！...“这里是永夜大陆。”“我的地盘。”","_index":14},{"catId":12,"rankCnt":"1.09万月票","bName":"以一龙之力打倒整个世界！","rankNum":16,"cat":"轻小说","cnt":"383.43万字","subCatId":60,"bid":"1043128588","subCat":"原生幻想","bAuth":"唐宋元明氢","desc":"【经过真龙指导，没有想当然，非乱写】钢铁为鳞，烈焰铸骨。红龙和铁龙的血脉在我体内交织融合，构筑出耀眼的新生，烈焰与钢铁是我与生俱来的天赋，适应与进化才是我证就永恒的权能。弱者顾虑重重，而王者，百无禁忌。凡是杀不死我的，都将使我更加强大。在我面前，跪伏者生，站立者死，万象生死皆我，生杀予夺由心。若整个世界与我为敌，我便以一龙之力燃烧这个世界，然后统治它的灰烬。吾名伽罗斯，世人敬我畏我，尊我为——永恒不灭之龙！————已有两百万字以上精品完本小说《掌控时光之龙》《帝龙》，欢迎各位品鉴阅读。","_index":15},{"catId":21,"rankCnt":"1.04万月票","bName":"诡秘之主","rankNum":17,"cat":"玄幻","cnt":"446.77万字","subCatId":73,"bid":"1010868264","subCat":"异世大陆","bAuth":"爱潜水的乌贼","desc":"诡秘之主动画特别篇已在腾讯视频上播出，欢迎大家前去观看！蒸汽与机械的浪潮中，谁能触及非凡？历史和黑暗的迷雾里，又是谁在耳语？我从诡秘中醒来，睁眼看见这个世界：枪械，大炮，巨舰，飞空艇，差分机；魔药，占卜，诅咒，倒吊人，封印物……光明依旧照耀，神秘从未远离，这是一段“愚者”的传说。","_index":16},{"catId":21,"rankCnt":"1.04万月票","bName":"夜夜行歌","rankNum":18,"cat":"玄幻","cnt":"26.63万字","subCatId":8,"bid":"1048859382","subCat":"东方玄幻","bAuth":"关关公子","desc":"我穿越大燕、生于市井，以布衣之身携三尺剑横扫江湖，如今位极人臣、威震天下，距挟兵自重、祸乱宫闱只差一步！你TM现在说我是太子？------已有完本万订《世子很凶》《仙子很凶》《女侠且慢》《鸣龙》，大伙有兴趣可以先看老书哦~","_index":17},{"catId":9,"rankCnt":"9722月票","bName":"急急如律令","rankNum":19,"cat":"科幻","cnt":"62.42万字","subCatId":252,"bid":"1049745989","subCat":"进化变异","bAuth":"黑山老鬼","desc":"你们灵异才复苏啊？我都被鬼缠了两年多了！另外，你说这世界上最凶的法，是我造的？","_index":18},{"catId":22,"rankCnt":"9492月票","bName":"清光宝鉴","rankNum":20,"cat":"仙侠","cnt":"149.18万字","subCatId":20101,"bid":"1048817253","subCat":"古典仙侠","bAuth":"一片苏叶","desc":"“且邀银汉九天月，共赏人间万古春。不问红尘纷扰事，半生修得劫外身...”————水中之月，如梦幻镜花。连蒙童都知道，水中的月亮只能眼观，无法触碰。可秦宣，他却能把月亮捞起来...……","_index":19}],"filters":[{"items":[{"text":"全站","value":-1},{"text":"玄幻","value":21},{"text":"奇幻","value":1},{"text":"武侠","value":2},{"text":"仙侠","value":22},{"text":"都市","value":4},{"text":"现实","value":15},{"text":"军事","value":6},{"text":"历史","value":5},{"text":"游戏","value":7},{"text":"体育","value":8},{"text":"科幻","value":9},{"text":"悬疑灵异","value":10},{"text":"诸天无限","value":20109},{"text":"轻小说","value":12}],"key":"catId","selectedIndex":0},{"items":[{"text":"当月","value":"202610"},{"text":"9月","value":"202609"},{"text":"8月","value":"202608"},{"text":"7月","value":"202607"},{"text":"6月","value":"202606"},{"text":"5月","value":"202605"}],"key":"yearmonth","selectedIndex":0}],"pageNum":1,"user":{"isLogin":false,"tucaoUrl":"","nickName":"","guid":0,"avatar":""}},"configData":null},"pageTrackReportExt":{"pid":"mqd_P_rank_01","type":"unlo
