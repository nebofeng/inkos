# 网文写作规则卡样例（蒸馏自指定章节，禁止照抄原文）
# 共 32 张；字段见 README.md

- id: OPEN-001
  title: 开篇不能一眼被猜完
  rule: 开头几句就要落到具体事件或反常细节，不能让读者用老套路把后面十章都填空。老套不是题材本身，而是路径完全可预测。
  check: 读完本章前 500 字，读者是否仍无法准确说出下一章的情节走向？
  good: 废柴被当众退亲，但他口袋里那枚“失效”的戒指正在发热，现场没人发现。
  bad: 家破人亡后立誓报仇，然后从娘胎写到十七岁拜师学艺。
  stage: [planner, writer, auditor]
  scope: opening
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第三节「开头的具体写法」

- id: OPEN-002
  title: 楔子只吊胃口，不占主线篇幅
  rule: 引子只点贯穿全文的线索或高层背景，用尽量短的篇幅吊住疑问。楔子写成三五章等于把正戏推后，读者会把引子当水文。
  check: 楔子/引子是否在一章内结束，且至少抛出一条后文必须兑现的线索？
  good: 八百字写秘境崩塌、一枚残印落入凡尘，下章立刻切少年捡到残印。
  bad: 连写四章上古神仙打架，第五章才出现与主角同名的婴儿。
  stage: [planner, writer, auditor]
  scope: opening
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第三节「开头的具体写法」

- id: OPEN-003
  title: 换背景前的铺垫必须能带过门
  rule: 穿越/重生是换地图。穿越前的失败、失恋、跳楼若与穿后能力、仇怨、选择无关，就压缩成几句交代，不要用几万字当门票。
  check: 穿越/换背景之前的段落，是否至少有一处信息在换背景后被用到（能力、人物、动机、伏笔）？
  good: 跳楼前把未寄出的悔过信塞进怀里，穿过去后信成了唯一信物。
  bad: 用三万字写职场被裁、女友分手、朋友冷漠，穿过去后这些人再不出现。
  stage: [planner, reviser, auditor]
  scope: early
  genre: [穿越, 重生]
  priority: high
  source: 《别说你懂写网文》第二章第三节「开头的具体写法」

- id: OPEN-004
  title: 开篇少堆形容词，少拉时间跨度
  rule: 前几章别用密集外貌/景物修饰证明文笔；也别从出生一路岁岁成长到成年才进冲突。没有强吸引力的童年，直接从能出事的年龄切进来。
  check: 本章是否既没有连续堆砌四处以上外貌形容词，也没有无冲突地跨越数年？
  good: 开篇就是十八岁的比武场，一句“左眉刀疤”带过长相，擂台上立刻被点名。
  bad: 从满月异象写到开蒙、十岁、十五岁，中间全是四季风景和眉目描写。
  stage: [writer, auditor, reviser]
  scope: opening
  genre: [all]
  priority: mid
  source: 《别说你懂写网文》第二章第三节「开头的具体写法」

- id: OPEN-005
  title: 前一万字：主角落地、人名可控、先埋一坑
  rule: 约三章内必须让焦点聚到主角身上；新人应让主角在第一或第二章出场。同期具名人物宜控制在五个以内，并至少点出一条后文要回收的伏笔。
  check: 前三章是否同时满足：主角已出场并占主视角、具名角色不超过五个、至少一处未解答的关键伏笔？
  good: 第一章主角被当众断骨，旁人只称“管事”和“师兄”，他袖中多出一枚来历不明的骨钉。
  bad: 第一章宴会点了十二个人名和三代恩怨，主角到第三章才作为旁听者出现。
  stage: [planner, writer, auditor]
  scope: opening
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第三节「开头的具体写法」

- id: HOOK-001
  title: 前三万字主角戏份过半
  rule: 开头三万字要有细纲，且主角相关篇幅至少一半。读者对书的好感首先来自对主角的好感；十几个人名抢印象，成功率会掉。
  check: 统计本章具名出场与有效段落，主角相关是否明显超过一半，且没有多名配角轮流抢戏？
  good: 全章跟主角讨债、藏功法、被逼签字，配角只作为压力源说话，不另开支线。
  bad: 城主、商会、三家子弟各写一段身世，主角在茶楼听了一下午墙角。
  stage: [planner, auditor]
  scope: early
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第四节「如何写好开头3万字」

- id: HOOK-002
  title: 设定后置，先给能追的东西
  rule: 前三万字不要倾倒世界观讲义。优先放能加强代入的情节、能领全文的坑、能立刻见效的金手指；粗略世界印象用一两处场景带过即可。
  check: 本章是否把笔墨花在主角处境/金手指/未解之问上，而不是大段无动作的设定说明？
  good: 用当铺规矩和一张欠条带出修炼要花钱，不另开“本界九品体系”说明文。
  bad: 连续两千字讲三大帝国、十二宗门、灵气潮汐，然后主角才起床。
  stage: [writer, auditor, reviser]
  scope: early
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第四节「如何写好开头3万字」

- id: HOOK-003
  title: 楔子一次埋多个追看疑问
  rule: 短楔子要同时抛出若干互相关联、后文必须回答的问题（动机、代价、阻拦者、后果、故事往哪走），让读者为解答而翻页，而不是为气氛而写景。
  check: 楔子或开篇高潮后，能否列出至少三个后文尚未回答、且彼此相关的问题？
  good: 自爆前他看见阻拦的女人戴着自己的旧玉；读者会问：她是谁、为何拦、炸完去哪。
  bad: 楔子只有“天下大乱，英雄辈出”的空镜头，没有任何具体未解事件。
  stage: [planner, writer, auditor]
  scope: opening
  genre: [all]
  priority: mid
  source: 《别说你懂写网文》第二章第四节「如何写好开头3万字」

- id: HOOK-004
  title: 前三万字按百字细纲瘦身
  rule: 已写成的开头用约百字细纲重梳主线，凡不服务这条线的形容词、路人外貌、场景和设定一律删。修基础错误即可，不必推倒重来。
  check: 删掉与百字细纲无关的段落/修饰后，本章事件链是否仍完整，且观感更短更快？
  good: 细纲是“被退亲—藏功法—当夜被抄家”；删掉师姐衣饰三百字，冲突更紧。
  bad: 为“文笔完整”保留集市三百字风光和路人对话，主线到章末还没推进。
  stage: [reviser, auditor]
  scope: early
  genre: [all]
  priority: mid
  source: 《别说你懂写网文》第二章第四节「如何写好开头3万字」

- id: GOLD-001
  title: 金手指要能把不合理说圆
  rule: 金手指是预先让读者接受的大不合理，用来解释后文的小不合理。必须给可相信的理由（哪怕是歪理），不能让主角无因飞天。
  check: 本章金手指的每一次超常效果，是否都能回溯到已交代的规则/来源，而不是作者临时开挂？
  good: 他用旧世界的药剂配比改了丹方，旁人只当他天赋逆天。
  bad: 小学学历穿越后无理由会写高考满分作文，也不提记忆或系统。
  stage: [planner, writer, auditor]
  scope: any
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第十一节「金手指」

- id: GOLD-002
  title: 前三章必须让金手指露头
  rule: 开头最需要金手指把读者拉进虚构规则。几十章仍像路边野草的主角，读者没有留下的理由。穿越重生之类要尽早兑现优势，而不是只当噱头。
  check: 前三章内，金手指是否已经以可感知的方式改变主角的选择或处境？
  good: 第二章他凭前世行情低价收了被当成废铁的灵材，当晚就还上高利贷利息。
  bad: 第十章还在写打工挨骂，系统面板只在内心独白里闪过一句“暂未开启”。
  stage: [planner, writer, auditor]
  scope: opening
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第十一节「金手指」

- id: GOLD-003
  title: 金手指要节制，不能当每章外挂
  rule: 满级开局很快无趣。需要时用、关键情节用；不要两三章就开一次，把稀缺感用光。读者能接受飞一个人，不能接受满街都在飞。
  check: 最近三章是否并非每次危机都靠金手指秒解，且至少一次用规则内的代价/操作过关？
  good: 这一章他靠打听和谈判过关，金手指只在确认契约真伪时扫了一眼。
  bad: 遇人就开透视，遇敌就开无敌，遇考就开答案，章章无代价。
  stage: [writer, auditor]
  scope: any
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第十一节「金手指」

- id: GOLD-004
  title: 金手指幅度要卡在憋屈和无敌之间
  rule: 开太小，敌人碾压，读者憋屈；开太大，一出场收服名将天下无敌，后面没得写。金手指还要能覆盖后续阶段，避免小学知识撑到高考这种漏洞。
  check: 本章冲突里，主角是否既不是无解挨打，也不是一招结束所有对手，且能力边界仍看得见？
  good: 先知让他避开埋伏，但当面对上宗门执法，仍得逃、仍得欠人情。
  bad: 穿到三国当天收齐五虎上将和诸葛周瑜，下一章已无对手。
  stage: [planner, writer, stuck]
  scope: any
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第十一节「金手指」

- id: COOL-001
  title: 先抑后扬，但不要把读者压走
  rule: 爽点常靠先打一巴掌再给糖：把目标推到看似够不着，再突然兑现一小步。压抑过头、长期无兑现，读者会先弃书。
  check: 本章是否存在“受阻/被贬”与“部分兑现”的配对，且压抑没有贯穿整章毫无出口？
  good: 被当废物赶出比武场，当夜她却把伤药和一块令牌塞进他手里就走。
  bad: 连续三章只写退亲、断骨、被吐口水，没有任何反击或意外收获。
  stage: [writer, auditor]
  scope: any
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第三章第五节「爽点」

- id: COOL-002
  title: 先把“必须得到”写进读者心里
  rule: 宝物、线索、人才在到手前要反复强化：它有多关键、多难、被谁盯着。读者产生需求后，主角拿到才是爽，而不是路边捡到就结束。
  check: 本章若有获得，此前是否已经交代其不可替代性和争夺压力？
  good: 两章里三次有人提到缺这味药会走火，仇家也在抢；他今夜才抢到半包。
  bad: 路过山洞随手捡到神兵，下一句已经无敌，前文从未提过这兵的存在。
  stage: [planner, writer, auditor]
  scope: any
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第三章第五节「爽点」

- id: COOL-003
  title: 养成只在瓶颈处小爆发
  rule: 升级线贯穿全书，但不要开局就天下无敌，也不要把每一次升小级写成高潮。只有突破卡点时给一次可见的能力跃迁，其余升级当过程。
  check: 本章升级/突破是否对应一个事先写明的瓶颈，而不是又一次全章感叹号式的“终于又升了”？
  good: 卡在筑基三月，今夜强行过关，只多了一息能看穿杀招，立刻拿去挡债主。
  bad: 每升一级都配三段爆发描写和一串感叹号，读起来像进度条播报。
  stage: [writer, auditor]
  scope: any
  genre: [玄幻, 仙侠, 高武, 系统]
  priority: mid
  source: 《别说你懂写网文》第三章第五节「爽点」

- id: COOL-004
  title: 优越感来自被贬后的对照，不来自空炫
  rule: 让读者爽的优越感，最好接在被看低、被拦门、被羞辱之后，用具体结果打脸。只写豪车名酒堆砌，桥段会显得又浅又旧。
  check: 本章炫富/露脸之前，是否有对立人物的轻视或阻碍作为对照？
  good: 售楼处让他滚，他按合同把定金拍在桌上，当场改签对面那套被说“配不上他”的。
  bad: 无冲突地连写三页座驾、手表、菜单价格，周围全是敬畏的路人。
  stage: [writer, auditor]
  scope: any
  genre: [都市, 重生, 娱乐]
  priority: mid
  source: 《别说你懂写网文》第三章第五节「爽点」

- id: COOL-005
  title: 送菜对照：更强者的好运落到主角手里
  rule: 可造一个看起来更强、更幸运、更会捡漏的对照角色，再让他的奇遇、宝物甚至机缘成为主角的垫脚石。读者要的是“你牛，我是主角”。
  check: 若出现对照天才，其高光是否在本章或紧邻章转化为主角的实际收益，而不是长期压主角一头？
  good: 天才刚开秘境，陷阱反噬；主角按他留下的路线收走残图和活口。
  bad: 对照天才连拿三次机缘，主角旁观赞美，自己毫无所得。
  stage: [planner, writer, auditor]
  scope: any
  genre: [玄幻, 仙侠, 系统]
  priority: low
  source: 《别说你懂写网文》第三章第五节「爽点」

- id: FORE-001
  title: 伏笔必须建档：长中短和回收状态
  rule: 每埋一笔就记下所在章、影响时长（长/中/短）、是否已回收、有无后续。没档就会埋伏笔不会圆、埋太多忘回收，连载会散。
  check: 本章新出现的未解信息，是否都能归入长中短某一类，并在规划里有预计回收点？
  good: 章末记下“铁盒密码=中期，约二十章后家主寿宴回收”。
  bad: 随手写墙上血字和失踪师妹，大纲里没有条目，后文也再未提起。
  stage: [planner, stuck]
  scope: any
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第三章第七节「埋设伏笔的几个技巧」

- id: FORE-002
  title: 支线坑趁读者还记得时收回
  rule: 主线长坑可以跨全书；支线坑不要拖到读者遗忘。记忆还热时引出并解决。暂不能收的，用思念、旁人闲话或信物反复提醒。
  check: 本章出现的支线伏笔，是否能在读者仍能复述它的窗口内看到回收或至少一次有效提醒？
  good: 上章被抢走的玉佩，本章仇家腰间一闪，主角当场抢回并问出上家。
  bad: 开篇被点名的师妹失踪后五十万字无提醒，读者已忘她姓什么。
  stage: [planner, writer, auditor]
  scope: any
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第三章第七节「埋设伏笔的几个技巧」

- id: FORE-003
  title: 线太多就收束支线或换地图
  rule: 伏笔铺太散、回不了主线时，先理出长期主坑，把副线一次性或分批完结。完结不了就换场景层级（失忆、传送、调任、进阶地图），把旧债暂停。
  check: 若本章线索超过主线负荷，是否明确完结至少一条支线，或给出可暂停旧线的地图升级理由？
  good: 县城仇家未清，调令来了；临行前把欠条和人证交给师兄，主线改去府城。
  bad: 同时追六条仇、三桩婚约、两处秘境，章内哪条都推不动。
  stage: [planner, stuck, reviser]
  scope: any
  genre: [all]
  priority: mid
  source: 《别说你懂写网文》第三章第七节「埋设伏笔的几个技巧」

- id: FORE-004
  title: 当面报，别让仇恨养几十万字
  rule: 休闲阅读受不了配角反复蹂躏主角、拖到中后期才翻盘。能当场报的当场报；君子报仇十年不晚在连载里容易变成憋屈。
  check: 本章对主角的羞辱/伤害，是否在近处给出可见反击或阶段性清算，而不是只积累仇恨值？
  good: 当众被断骨后，他当晚用把柄逼对方当众撤婚并吐出聘礼。
  bad: 同一反派连虐十章，主角只在心里说“三十年河东”。
  stage: [writer, auditor]
  scope: any
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第三章第七节「埋设伏笔的几个技巧」

- id: EXPECT-001
  title: 种因之后要反复提醒快兑现
  rule: 只在开头埋仇、埋宝还不够。高手会在成长节点提醒读者：账还在、快能还了。新手埋完就按自己的大纲走，中间零提醒，期待感会断。
  check: 本章是否至少一次用对白、信物或内心把未兑现的前因重新推到读者眼前？
  good: 突破后他摸断指，听见当年退亲的笑；下章就要回宗门大比。
  bad: 开篇灭门后三十章只打怪升级，再无人提起仇家姓名。
  stage: [writer, auditor]
  scope: any
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第三章第十二节「期待感」

- id: EXPECT-002
  title: 本场结束前先把下一场线索交到手里
  rule: 大故事套中故事套小故事。每个场景高潮到来前，预先布置下一场景的条件或收获，让读者在这一场爽完仍要追下一场，而不是单情节打一枪换一个地方。
  check: 本章高潮或收束处，是否给出下一章必须处理的具体线索/任务/人物，而不是纯收尾？
  good: 找到药一的同时，药师留下药二在敌营的地址，章末他已经摸到营门。
  bad: 打完一场完全结束，下章另起炉灶去赶集，两章之间没有钩子。
  stage: [planner, writer, auditor]
  scope: any
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第三章第十二节「期待感」

- id: EXPECT-003
  title: 先让读者判错，再给情理之中的反转
  rule: 用信息诱导读者形成判断（某人是坏蛋/某路能通），结局相反却仍符合已给过的细节。读者会为了验证自己的判断而追更，反转时才有刺激。
  check: 本章或本弧是否存在可被后文打脸的明确误导，且反转能在前文找到伏笔，而不是作者临时改口？
  good: 全城指认冷面执事害人，翻账本才发现他一直在挡刀，真凶是笑面师兄。
  bad: 突然宣布反派其实是卧底，前文没有任何不合逻辑的“善行”可对上。
  stage: [planner, writer, auditor]
  scope: any
  genre: [all]
  priority: mid
  source: 《别说你懂写网文》第三章第十二节「期待感」

- id: EXPECT-004
  title: 先兑现一块糖，再暗示后面还有糖
  rule: 长线副本里不要把收获全部押到终点。中途先给预期中的那件东西，再让主角为更大好处继续冒险。读者刚满足，立刻被新的可能拉住。
  check: 本章在兑现既定收获后，是否立刻露出更大风险/更大收益的新目标？
  good: 他拿到要的残卷，却看见更里层还有完整本，守卫已经醒了。
  bad: 历险结束宝物入手，下章休息养伤，再无新的可见好处。
  stage: [planner, writer]
  scope: any
  genre: [all]
  priority: mid
  source: 《别说你懂写网文》第三章第十二节「期待感」

- id: PLOT-001
  title: 有效剧情必须同时露出人设和情绪
  rule: 有效剧情不是报地点和流程，而是让事件里的人怎么说话、怎么选，把性格和当下情绪演出来。只有环境没有人物交互，读者会问“那跟我有什么关系”。
  check: 本章关键段落是否能同时回答：这件事里主角是什么样的人、他此刻是什么情绪？
  good: 破船里少年骂官府收渔税，主角不接话，只把最后一把米按进弟弟碗里。
  bad: 用八百字介绍码头、渔税、帮派名称，没有任何带着情绪的人物反应。
  stage: [writer, auditor]
  scope: opening
  genre: [all]
  priority: high
  source: linux.do 2754078

- id: PLOT-002
  title: 对话要同时推事件和立人
  rule: 开篇对话别寒暄。每句应对能带出新信息（谁在欺压、缺什么、下一步做什么），也能听出说话人在关系网里的位置。对话若可删而不损情节，就是废对话。
  check: 删掉任意一段对白后，本章事件或人物关系是否会缺一块？若不会，这段就不合格。
  good: “税加三成。”“加就加，别动我网。”孩子王一句话既认怂又护局。
  bad: 两人互问吃了吗、天气真好、你也来了，三轮后才说正事。
  stage: [writer, auditor]
  scope: any
  genre: [all]
  priority: high
  source: linux.do 2754078

- id: PLOT-003
  title: 开篇人物分成至多三个集团
  rule: 黄金开篇里角色再多，也要收成少数几个功能集团（如：还能翻身的、主角、一群共用命运的酱油），避免人人独立发言。前期小反派必须是现在能碾压主角的。
  check: 前三章具名/发言角色是否可归入不超过三个集团，且出现的小boss在当前实力上明显压过主角？
  good: 孩子王一家、主角孤儿、金河帮管事；管事当场能砸船，主角只能低头。
  bad: 六个少年轮流自我介绍身世理想，外加三个路人官差各说一段。
  stage: [planner, writer, auditor]
  scope: opening
  genre: [all]
  priority: high
  source: linux.do 2754078

- id: PLOT-004
  title: 变强后立刻拿去处理眼前的屈辱
  rule: 个人变强不是为了继续无目标升级。金手指或突破出现后，下一拍应回到开头的具体困境（债、帮派、家人、被欺），让读者看见“能还手了”。只变强不回归，代入会断。
  check: 本章若有能力提升，是否在本章或下一章用于处理开篇已提出的现实压力？
  good: 根骨加点后他立刻去武馆报名，因为那是被金河帮踩的唯一出路。
  bad: 觉醒后连升三级，下一章改去秘境猎奇，欠税和辱骂再未提及。
  stage: [planner, writer, auditor]
  scope: early
  genre: [all]
  priority: high
  source: linux.do 2754078

- id: PLOT-005
  title: 目标锁定，过程加波折和收获
  rule: 只有“想做—去做—做到”是流水账。锁定一个读者能记住的目标，中途加阻碍、意外、延迟满足，并让手段暴露人设；复杂化不是注水，是让每一次解决都带新筹码。
  check: 本章是否能用一句话写出主角当前目标，并且过程中至少有一次受阻和一次非预期收获？
  good: 目标只是吃上那碗饭；加班、电梯、危险司机都拦路，最后饭里还藏了新功能。
  bad: 下楼、打车、进店、吃饭、很香、很饱，全程无意外也无人设选择。
  stage: [planner, writer, auditor]
  scope: any
  genre: [all]
  priority: high
  source: linux.do 2898218

- id: GENRE-001
  title: 不要把互斥读者盘焊在同一本书上
  rule: 题材先定读者。两个几乎不交叉的盘子硬拼（如原创诸天与同人诸天），结果是两边都觉得被稀释。一本书只服务一套心理预期。
  check: 本书开篇所承诺的核心玩法（同人梗/原创世界/单线升级等）是否前后一致，没有把另一盘读者的要素当卖点塞进来？
  good: 封面和第一章都只打“某经典同人世界里的求生流”，不掺原创诸天地图。
  bad: 简介同时保证原著角色全员在场，又保证完全原创宇宙互不干扰。
  stage: [planner]
  scope: opening
  genre: [all]
  priority: high
  source: linux.do 2859872

- id: GENRE-002
  title: 平台吃什么，开篇就先给什么
  rule: 同一题材在不同站的梯度不同。写给某站，就要用该站读者已经形成的期待来开局，而不是把在另一站吃香的写法原样搬过来。
  check: 前三章的核心爽点/节奏是否符合目标平台该类目的常见预期（而不是错位成另一站的写法）？
  good: 投番茄的求生开局：灾难落地、觉醒对比、立刻看见比别人过得好的收获。
  bad: 给番茄开一篇慢热文娱名利场，前三章全是圈内黑话和长对话，没有对比收获。
  stage: [planner, auditor]
  scope: opening
  genre: [all]
  priority: high
  source: linux.do 2859872

- id: GENRE-003
  title: 热门题材必须把爽点写明白，并避开已知毒点
  rule: 热门盘来得快去得也快：爽点含糊或踩毒点，追读会断。冷门盘书少、读者较真、留存可以很高，但不能拿“没人写”当理由把基本因果写乱。讨好读者比押冷热更重要。
  check: 本章所属题材的核心爽点是否被具体事件兑现，且没有出现该类目读者明确反感的处理？
  good: 求生文开篇就用邻居空仓对照主角的净水与守夜轮班，收获看得见。
  bad: 热门升级文写了三章心情和风景，等级、对比、收获都没出现。
  stage: [planner, writer, auditor]
  scope: early
  genre: [all]
  priority: mid
  source: linux.do 2859872
