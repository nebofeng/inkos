# 短篇 / 知乎短篇规则卡（蒸馏自指定章节 + linux.do，禁止照抄原文）
# 共 18 张；字段同 cards-sample.yaml；scope 一律 short

- id: SHORT-001
  title: 首句落到事件或反常细节
  rule: 第一句就要出事或露出不对劲的具体物，不能用氛围、金句、身世概述开场。读者用老套路填完后十段的，就是失败的首句。
  check: 删掉第一句后，开篇是否立刻失去“此刻正在发生什么”的抓手？
  good: 公证处的印章盖下去时，她发现遗嘱多了一行自己没签过的字。
  bad: 夜色如墨，人生总有不期而遇的转折，故事就这样开始了。
  stage: [writer, auditor]
  scope: short
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第三节「开头的具体写法」

- id: SHORT-002
  title: 首段必须抛出单一冲突
  rule: 前 200 字内点明谁要什么、谁挡着、拖过今晚会怎样。短篇没有三章热身，首段不抛冲突等于把篇幅浪费在门票上。
  check: 读完首段，能否用一句话写出“谁 vs 什么、今晚的代价”？
  good: 面试还剩十二分钟，前任坐在对面，手里是她没交的竞业协议。
  bad: 先写地铁、天气、童年和公司简介，第三段才说今天要离职。
  stage: [planner, writer, auditor]
  scope: short
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第三节「开头的具体写法」

- id: SHORT-003
  title: 知乎开篇先回应问题设定
  rule: 以回答体发布时，开头两句必须碰到题面里的人物、场景或选择，再进故事。先抒情或先讲无关童年，等于没切题。
  check: 前三句是否出现题面关键词（人物/场景/两难），并且故事明显是在回答该问？
  good: 题问“要不要拆穿同事偷改报表”；首句她把U盘按进键盘，说拆。
  bad: 题问同事改报表，开头写雨夜想家、职场不易，三段后才出现公司。
  stage: [planner, writer, auditor]
  scope: short
  genre: [知乎]
  priority: high
  source: linux.do 2754078

- id: SHORT-004
  title: 标题只许诱惑一次，正文必须兑现
  rule: 标题用反常、两难或结果倒装把人点进来，但承诺的事件必须在正文出现。空头支票和色情硬钩都会掉印象分；全文标题党连发等于反复调戏。
  check: 标题里最诱人的那个词/事件，是否在正文里以具体情节兑现，且不是文不对题的纯噱头？
  good: 标题《我把辞职信交到了自己名下的公司》；文中她真签了，老板是她。
  bad: 标题《午夜那通电话改变命运》，正文只有加班心情和鸡汤，没有电话。
  stage: [planner, auditor]
  scope: short
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第六节「从标题党看诱惑性创作」

- id: SHORT-005
  title: 全篇只服务一个核心冲突
  rule: 2200–3500 字装不下两条主线。配角、闪回、金手指只为那一个今晚必须解决的问题服务；多出来的仇、恋、世界观一律删或改成一句交代。
  check: 能否用一句话概括全文冲突，且不存在第二条需要单独收束的主线？
  good: 全文只写她今晚要不要按下发送，把录音交给记者。
  bad: 同时写职场举报、前任复合、母亲住院，三段都想当高潮。
  stage: [planner, reviser, auditor]
  scope: short
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第十二节「主角，你在干什么？」

- id: SHORT-006
  title: 2200–3500 字按凤头猪肚麒麟尾切段
  rule: 短篇就是一个完整的凤头猪肚麒麟尾：前约 1/5 精要入戏，中段承压蓄势，末约 1/5 收束并留余味。不要前半灌设定、后半赶结局，也不要通篇高潮或通篇平铺。
  check: 全文是否落在 2200–3500 字，并能标出三段，且开头、结尾各自不超过全文约 1/4？
  good: 2800 字：400 字案发，1800 字对质与误导，600 字反转落点。
  bad: 前 2000 字写成长史，最后 300 字把冲突、反转、升华一次性塞完。
  stage: [planner, reviser, auditor]
  scope: short
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第五章第一节「凤头猪肚麒麟尾」

- id: SHORT-007
  title: 起承转合四拍都要能指认
  rule: 起抛事件，承缝合铺垫，转必须跌宕（由事及理或由误到真），合收本篇并带出下一拍余味。缺承会跳，缺转是流水账，缺合像没写完。
  check: 能否在文中标出起、承、转、合四处，且“转”不是换场景而是判断被推翻？
  good: 起：她接匿名短信；承：对上旧邮件；转：发信人是她自己；合：她删了发送箱。
  bad: 上班、开会、下班、睡觉，四段并列，没有任何判断被改写。
  stage: [planner, writer, auditor]
  scope: short
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第二章第十节「起承转合」

- id: SHORT-008
  title: 至少一次反转，且能回溯到前文细节
  rule: 先诱导读者形成一个明确判断，再给出相反却仍符合已写细节的结果。没有铺垫的突然改口不是反转，是作者赖账；短篇可以只反转一次，但必须有。
  check: 文中是否存在一次与读者预期相反的落点，并且能在前文指出至少一处伏笔？
  good: 全篇暗示男友出轨；末段聊天记录显示他在替她顶锅，此前他口袋里那张罚单已出现过。
  bad: 结尾宣布“其实她是卧底”，前文没有任何不合身份的举动。
  stage: [planner, writer, auditor]
  scope: short
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第三章第十二节「期待感」

- id: SHORT-009
  title: 结尾落在余味或反转，不落在总结
  rule: 最后一段用一个动作、物件或未说完的话收束，让读者回头重看开头。不要把主题写成格言，不要解释“这个故事告诉我们”。麒麟尾要尖，不要肿。
  check: 末段是否以具体动作/物件/对白收束，并且没有作者站出来总结主题的句子？
  good: 她把戒指放回盒里，灯还亮着，门外电梯叮了一声。
  bad: 原来亲情才是永恒，经历过今晚，她终于懂得了珍惜。
  stage: [writer, auditor, reviser]
  scope: short
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第五章第一节「凤头猪肚麒麟尾」

- id: SHORT-010
  title: 人设用一次选择立住，不靠形容词
  rule: 主角要有一个别人换不上去的选择或口头禅式动作。短篇没篇幅养成多面人；单突出特质，用情节催化，不要堆眉目描写。
  check: 把主角名字换成路人后，关键选择是否立刻变得不合理（仍合理则人设未立住）？
  good: 别人抢着撇清，她把签字笔塞回对方手里：“你写，我按。”
  bad: 她性格复杂、善良又矛盾，外貌用了五个形容词，全程没有一次独特选择。
  stage: [planner, writer, auditor]
  scope: short
  genre: [all]
  priority: high
  source: linux.do 2898218

- id: SHORT-011
  title: 对话同时推进事件和关系
  rule: 每句对白要带新信息（把柄、条件、下一步）或暴露关系位置。可删而不损情节的寒暄、互相确认心情，一律删。
  check: 任意删掉一段对白后，事件或人物关系是否会缺一块（不缺则该段不合格）？
  good: “监控在我这。”“那你要什么？”“今晚换班表上的那个名字。”
  bad: “你吃了吗。”“吃了。”“天气真好。”“是啊。”然后才说正事。
  stage: [writer, auditor]
  scope: short
  genre: [all]
  priority: high
  source: linux.do 2754078

- id: SHORT-012
  title: 去掉总结升华和排比金句
  rule: 短篇最容易露 AI 味的位置是段末和文末：抽象情绪标签、排比哲理、全知旁白点评。改成可看见的动作、物件和带情绪的对话；旁白插科打诨会打断代入。
  check: 全文是否没有“或许这就是/原来人生/综上所述”一类收束，且连续排比金句不超过两句？
  good: 她把工牌扔进碎纸机，碎片里还卡着半个姓。
  bad: 或许这就是成长，在失去中获得，在告别里与自己和解。
  stage: [writer, auditor, reviser]
  scope: short
  genre: [all]
  priority: high
  source: linux.do 2754078

- id: SHORT-013
  title: 伏笔必须在本篇回收
  rule: 短篇没有“二十章后再揭”。开篇埋的物件、口误、时间差，必须在合处兑现；只留余味、不留未解释的关键情节。短线坑趁读者还记得时收回。
  check: 开篇抛出的未解信息，是否都在文内得到解释或明确转化为余味（而非遗忘）？
  good: 开头抽屉里的第二把钥匙，结尾打开的是隔壁已清空的工位。
  bad: 开篇桌上有封没拆的信，全文再未提起，结尾另起一句“她释然了”。
  stage: [planner, auditor]
  scope: short
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第三章第七节「埋设伏笔的几个技巧」

- id: SHORT-014
  title: 种因之后中段要再提醒一次
  rule: 只在开头埋仇、埋物不够。中段用对白、信物或误读把前因推到眼前，读者才会为兑现而读完。短篇的提醒窗口只有一次，放在转之前。
  check: 中段是否至少一次用对白/物件把开篇前因重新推到读者眼前，再进入反转或兑现？
  good: 对质前她摸到口袋里那枚被抠掉姓名的工牌，才敢把录音笔打开。
  bad: 开头被当众羞辱后，中段全写加班流程，直到结尾才突然报复，中间零提醒。
  stage: [writer, auditor]
  scope: short
  genre: [all]
  priority: high
  source: 《别说你懂写网文》第三章第十二节「期待感」

- id: SHORT-015
  title: 具名人物压到四个以内
  rule: 短篇里名字会互相抢印象。焦点人物 1–2 个，对立面 1 个，其余用职务或关系称呼。酱油给名字等于让读者记错主角。
  check: 全文具名角色是否不超过四个，且主角戏份明显过半？
  good: 只具名“林晏”和“周姐”，其余称前台、司机、那个实习生。
  bad: 办公室点了八个人名轮流发言，主角到后半才被读者认出来。
  stage: [planner, writer, auditor]
  scope: short
  genre: [all]
  priority: mid
  source: 《别说你懂写网文》第二章第四节「如何写好开头3万字」

- id: SHORT-016
  title: 中段可藏关键信息，结尾必须给答案
  rule: 精彩处是让读者猜，不让读者猜中。可切换视角、用旁人转述、把结果藏在细节里，但短篇不允许把答案推到“未写出的下章”。藏是为了合，不是为了断。
  check: 文中是否存在一处被有意延后的关键信息，并且该信息在结尾前已经交付？
  good: 中段只写“闪光之后门关了”；结尾监控回放补全是她自己锁的门。
  bad: 写到刀举起就结束，用“后事如何请听下回”把答案甩出本篇。
  stage: [planner, writer, auditor]
  scope: short
  genre: [all]
  priority: mid
  source: 《别说你懂写网文》第二章第六节「从标题党看诱惑性创作」

- id: SHORT-017
  title: 目标锁定，过程加一次受阻和一次意外收获
  rule: “想做—做成”是流水账。短篇也要让手段暴露人设：同一目标下至少一次受阻、一次非预期收获。复杂化不是注水，是让解决带新筹码。
  check: 能否用一句话写出主角当前目标，并且过程中同时存在一次受阻和一次非预期收获？
  good: 目标只是取回U盘；门禁失效是受阻，U盘里多出一份对他不利的录音是收获。
  bad: 下楼、打车、进门、拿走U盘、很顺利，全程无意外也无人设选择。
  stage: [planner, writer, auditor]
  scope: short
  genre: [all]
  priority: high
  source: linux.do 2898218

- id: SHORT-018
  title: 先压一口再给出口，不许整篇只虐
  rule: 短篇同样靠先打一巴掌再给糖抓住阅读欲：让目标看似够不着，再兑现一小步或对照更惨的对手。全程压抑、绿帽式折磨、作者插话扫兴，都会把读者先送走。
  check: 文中是否存在“受阻/被贬”与“部分兑现或对照出口”的配对，且压抑没有贯穿全文毫无出口？
  good: 当众被撤职后，她把备份邮件投进纪委箱，发送成功的提示音响了。
  bad: 从开头骂到结尾只写被羞辱、被扣薪、被分手，没有任何反击或意外收获。
  stage: [writer, auditor]
  scope: short
  genre: [all]
  priority: mid
  source: 《别说你懂写网文》第五章第三节「如何抓住读者心理」
