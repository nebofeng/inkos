# InkOS —— 放在 /opt/docker-dir/inkos/compose.yml（目录权限 700）
#   /opt/docker-dir/inkos/
#   ├── compose.yml
#   ├── .env            # 由 .env.example 复制，chmod 600；密钥只放这里
#   ├── data/           # = 服务器3 的 /workspace/inkos-data 整个目录（inkos.json、books/、.inkos/、radar/ ...）
#   └── backup/daily/   # 运维的备份目录，容器不挂载
# 只用 bind mount（./data），不用命名卷/匿名卷。详见 README.md。
name: inkos

# 语法只用 compose v2.26 已支持的特性（服务器1 是独立版 docker-compose v2.26.1）。
x-inkos-common: &inkos-common
  image: ${INKOS_IMAGE:-@@NEWTAG@@}
  # 异常退出（非 0）自动重启，最多 5 次；配置类错误（64/65/66/78）重试 5 次后停下，不会无限重启。
  # 注意：docker-compose 非 swarm 模式会忽略 deploy.restart_policy，所以这里用 restart: 键。
  restart: ${INKOS_RESTART:-on-failure:5}
  env_file:
    - .env
  environment:
    TZ: ${TZ:-Asia/Shanghai}
    INKOS_PROJECT_ROOT: /data
    INKOS_STUDIO_PORT: "4567"
  # 镜像默认用户 node = 1000:1000；数据属主不是 1000 时改 .env 里的 INKOS_UID/INKOS_GID，或 chown 数据目录
  user: "${INKOS_UID:-1000}:${INKOS_GID:-1000}"
  volumes:
    - type: bind
      source: ./data
      target: /data
      bind:
        create_host_path: false
  networks:
    - default
    - sub2api
  mem_limit: ${INKOS_MEM_LIMIT:-1g}
  logging:
    driver: json-file
    options:
      max-size: ${INKOS_LOG_MAX_SIZE:-20m}
      max-file: "${INKOS_LOG_MAX_FILE:-5}"

services:
  # Studio Web（容器内 4567）。宿主机只绑 Docker 内网地址，由 Nginx Proxy Manager 转发。
  inkos:
    <<: *inkos-common
    container_name: inkos
    command: ["studio"]
    ports:
      - "${INKOS_BIND:-172.17.0.1}:${INKOS_PORT:-4567}:4567"
    # Studio 自带登录（INKOS_STUDIO_USER / INKOS_STUDIO_PASSWORD_HASH，写在 .env，见 README「Studio 登录」）。
    # 健康检查走不需要登录的 /healthz；登录未配置时 /healthz 返回 503，容器显示 unhealthy。
    healthcheck:
      test: ["CMD", "node", "/usr/local/lib/inkos/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 20s

  # 写作 daemon（= 服务器3 上的 `inkos up`），和 Studio 共用 ./data。
  # 启动前检查模型配置，不可用时打印原因并以 78 退出（见 README「退出码」）。
  inkos-daemon:
    <<: *inkos-common
    container_name: inkos-daemon
    command: ["daemon"]
    mem_limit: ${INKOS_DAEMON_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "node", "/usr/local/lib/inkos/healthcheck.mjs", "daemon"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 60s

networks:
  # 项目默认网络固定网段（docker-proxy / userland-proxy 开启时，从宿主机已发布端口进来的
  # 请求在容器里看到的 peer 就是这个网关）。INKOS_TRUSTED_PROXIES 只信该网关。
  # 改网段必须 docker-compose down 再 up（只 up -d 不会改已有网络的 IPAM）。
  # 两个服务同时还加入下面的外部网络 sub2api，互不影响。
  default:
    ipam:
      config:
        - subnet: "${INKOS_SUBNET:-172.31.67.0/24}"
          gateway: "${INKOS_GATEWAY:-172.31.67.1}"
  # sub2api 所在的 docker 网络（外部网络）。服务器1 上是 sub2api_sub2api-network，
  # sub2api 容器在该网络里的别名 sub2api、容器端口 8080，所以 inkos.json 里 baseUrl 写 http://sub2api:8080/v1
  sub2api:
    external: true
    name: ${SUB2API_NETWORK:-sub2api_sub2api-network}
